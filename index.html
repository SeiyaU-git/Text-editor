<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <aside class = "sidebar">
        <head>DOCUMENT TABS</head>
        <nav>
            <ul class = "document_tab_list">
                <button class = "document_tab_btn" data-tab-name = "current_tab">
                    <i class='bx bxs-file-doc'></i>
                    <span>Current tab</span>
                </button>

                <button class = "document_tab_btn" data-tab-name = "tab2">

                    <i class='bx bxs-file-doc'></i>
                    <span>Tab 2</span>
                </button>

                <button class = "document_tab_btn" data-tab-name = "tab3">
                    <i class='bx bxs-file-doc'></i>
                    <span>Tab 3</span>
                </button>

                <button id="createTab" class="document_tab_btn" data-tab-name="new_tab">
                    <i class='bx bxs-file-doc'></i>
                    <span>Create Tab</span>
                </button>
            </ul>

            <button id="create_document_btn">
                <i class='bx bxs-file-plus'></i>
                <span>New Document</span>
            </button>
        </nav>
    </aside>
    <main>

       
        <div id="editor" contenteditable="true" ></div>


        <script type="module" src="script.js"></script>

    </main>
</body>
</html>
