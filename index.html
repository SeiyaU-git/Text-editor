<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <aside class = "sidebar">
        <head>DOCUMENT TABS</head>
        <nav>
            <ul class = "document_tab_list">
                
            </ul>
            <!-- WOWOWOW -->

            <div class="document_btns">

                <button id="create_document_btn">
                    <i class='bx bxs-file-plus'></i>
                    <span>New</span>
                </button>

                <button id="delete_document_btn">
                    <i class='bx bxs-trash'></i>
                    <span>Delete</span>
                </button>

                <button id="save_document_btn">
                    <i class='bx bxs-save' ></i>
                    <span>Save</span>
                </button>

                <button id="load_document_btn">
                    <i class='bx bxs-file-import'></i>
                    <span>Load</span>
                </button>

                <button id="rename_document_btn">
                    <i class='bx bxs-rename' ></i>
                    <span>Rename</span>
                </button>
            
            </div>

        </nav>
    </aside>

    

    <main class="content-area">

        <div class = "document_context_menu">
            <ul>
                <li><a href = "#"> Bold </a></li>
                <li><a href = "#"> Italics </a></li>
                <li><a href = "#"> Header </a></li>
                <li><a href = "#"> delete </a></li>
            </ul>
        </div>
       
        <div id="editor" contenteditable="true" ></div>


        <script type="module" src="script.js"></script>

        <input type="file" id="fileInput" accept=".txt" hidden>

        


    </main>
</body>
</html>
