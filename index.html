<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <aside class = "sidebar">
        <h2>DOCUMENT TABS</h2   >
        <nav>
            <button class = "sidebar_collapse"><i class='bx bx-sidebar'></i></button>
            <ul class = "document_tab_list">
                
            </ul>
            <!-- WOWOWOW -->

            <div class="document_btns">

                <button id="create_document_btn">
                    <i class='bx bxs-file-plus'></i>
                    <span>New</span>
                </button>

                <button id="delete_document_btn">
                    <i class='bx bxs-trash'></i>
                    <span>Delete</span>
                </button>

                <button id="save_document_btn">
                    <i class='bx bxs-save' ></i>
                    <span>Save</span>
                </button>

                <button id="load_document_btn">
                    <i class='bx bxs-file-import'></i>
                    <span>Load</span>
                </button>

                <button id="rename_document_btn">
                    <i class='bx bxs-rename' ></i>
                    <span>Rename</span>
                </button>
            
            </div>

        </nav>
    </aside>

    

    <main class="content-area">
     
        <div id="editor" contenteditable="true" ></div>


        <script type="module" src="script.js"></script>

        <input type="file" id="fileInput" accept=".txt" hidden>

        


    </main>

    <aside>
        <h2>Shortcuts</h2>

        <p>Bold</p>
        <kbd>Ctrl</kbd> + <kbd>B</kbd>

        <p>Italics</p>
        <kbd>Ctrl</kbd> + <kbd>I</kbd>

        <p>Header</p>
        <kbd>Ctrl</kbd> + <kbd>H</kbd>

        <p>List</p>
        <kbd>Ctrl</kbd> + <kbd>8</kbd>

        <p>Underline</p>
        <kbd>Ctrl</kbd> + <kbd>U</kbd>

        <kbd id = "ctrl_kbd">Ctrl</kbd>


    </aside>

    <div class = "context_menu document_context_menu">
        <ul>
            <li><button class = "doc_context_btn" data-func = "bold"><i class='bx bx-underline'></i>  Bold <span>ctrl B</span></button></li>
            <li><button class = "doc_context_btn" data-func = "italics"><i class='bx bx-italic'></i>  Italics <span>ctrl I</span></button></li>
            <li><button class = "doc_context_btn" data-func = "header"><i class='bx bx-header'></i>  Header <span>ctrl H</span></button></li>
            <li><button class = "doc_context_btn" data-func = "list"><i class='bx bx-list-ul'></i>  List <span>ctrl 8</span></button></li>  
            <li><button class = "doc_context_btn" data-func = "un-line"><i class='bx bx-underline'></i>  Underline <span>ctrl U</span></button></li>  
            <li><button class = "doc_context_btn" data-func = "strike"><i class='bx bx-strikethrough'></i>  Strike <span></span></button></li> 
            <li><button class = "doc_context_btn" data-func = "highlight"><i class='bx bx-highlight'></i>  Highlight <span></span></button></li> 
            
            
        </ul>
    </div>

        <div class = "context_menu tab_context_menu">
        <ul>
            <li><button class = "tab_context_btn" data-func = "delete"> Delete</button></li>
            <li><button class = "tab_context_btn" data-func = "rename"> Rename</button></li>
            <li><button class = "tab_context_btn" data-func = "save"> Save</button></li>
        </ul>
    </div>
</body>
</html>
